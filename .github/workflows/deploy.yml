# Deploys to cPanel on push to main (after CI passes).
# Setup: see CI_CD.md and configure GitHub repository secrets.
name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Upload Vite build
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Vite build
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      - name: Configure SSH key
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh

          FIRST_LINE="$(echo "$SSH_KEY" | tr -d '\r' | sed '/./!d;q')"
          if echo "$FIRST_LINE" | grep -qE '^(ssh-rsa|ssh-ed25519|ecdsa-sha2-)'; then
            echo "ERROR: CPANEL_SSH_KEY looks like a PUBLIC key."
            echo "Use the private key (-----BEGIN ... PRIVATE KEY-----)."
            exit 1
          fi

          if echo "$SSH_KEY" | grep -q '^-----BEGIN'; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | tr -d '\n\r' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || {
              echo "ERROR: Could not decode CPANEL_SSH_KEY as base64 or PEM."
              exit 1
            }
          fi
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>/tmp/deploy_key_err.txt; then
            echo "ERROR: Invalid or passphrase-protected private key."
            cat /tmp/deploy_key_err.txt || true
            echo "Generate a deploy key with no passphrase: ssh-keygen -t ed25519 -N \"\" -f github_deploy"
            exit 1
          fi

      - name: Deploy application on server
        env:
          APP_URL: ${{ secrets.DEPLOY_APP_URL }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          set -e
          SSH_OPTS="-o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p ${CPANEL_SSH_PORT:-22}"

          ssh ${SSH_OPTS} "${CPANEL_USERNAME}@${CPANEL_HOST}" bash -s <<REMOTE
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          echo "=== Pulling latest code ==="
          git fetch origin main
          git reset --hard origin/main
          chmod +x scripts/deploy-remote.sh
          export APP_URL="${APP_URL}"
          bash scripts/deploy-remote.sh
          REMOTE

      - name: Upload Vite build to server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -P "${CPANEL_SSH_PORT:-22}" \
            -r public/build "${CPANEL_USERNAME}@${CPANEL_HOST}:${DEPLOY_PATH}/public/"

      - name: Deployment summary
        env:
          APP_URL: ${{ secrets.DEPLOY_APP_URL }}
        run: |
          echo "Deployed to ${APP_URL:-cPanel server}"
          echo "Commit: ${GITHUB_SHA}"
